# Point ASSAY_POLICY_FILE at a copy of this file. Only the keys you set override the defaults.
sdk_minimums:
  mcp: "1.10.0"
  fastmcp: "2.10.0"
  "@modelcontextprotocol/sdk": "1.24.0"
runtime_minimums: { python: "3.10", node: "22" }
dimension_weights:            # must sum to 1.0
  security: 0.35
  maintainability: 0.20
  scalability: 0.15
  reliability: 0.12
  performance: 0.10
  observability: 0.08
decision_bands: { go: 80, conditions: 65, not_ready: 45 }
thresholds:
  tools_many: 25
  complexity_high: 25
  test_ratio_low: 0.15
